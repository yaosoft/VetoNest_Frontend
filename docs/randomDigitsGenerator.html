<!DOCTYPE html>
<html>
<head>
	<title>Random Digits Generator</title>
</head>
<body>
	<p id="result">bar<b>foo</b>baz</p>
	
	<script>
		const domain  = 'vetonest.com_';
		const prefixe = 'cmp_' + domain;
		const generateRandomDigits = (n) => {
			const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
			// const characters = '123456789';
			let result = '';
			for (let i = 0; i < n; i++) {
				const randomIndex = Math.floor(Math.random() * characters.length);
				result += characters.charAt(randomIndex);
			}
			
			console.log( result );
			const resultElt = document.getElementById( "result" );
			const eltContent = resultElt.innerHTML;
			resultElt.innerHTML = prefixe + result;
		}
		
		generateRandomDigits( 10 )
	</script>
</body>
</html>
